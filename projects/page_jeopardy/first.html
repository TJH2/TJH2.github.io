<!DOCTYPE html>
<html>
    <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }
            body {
                font-family: "kreon";
                text-align: center;
                background-color: blue;
            }
            main {
                display: grid;
                grid-template-columns: 33.33% 33.33% 33.33%;
                grid-auto-rows: 1fr;
                height: 97.5vh;
            }
            section {
                border-bottom: 2px black solid;
                height: auto;
            }
            h2 {
                color: white;
                font-weight: bolder;
                font-size: 50px;
                width: 100%;
                border: 2px black solid;
                padding: 5px 0px;
            }
            button {
            font-weight: bold;
            border: 2px black solid;
            font-size: 50px;
            display: block;
            margin: auto;
            background-color: blue;
            color: yellow;
            width: 100%;
            height: 60%;
            }
            #question, #dailyDouble {
                background-color: blue;
                border: black solid 2px;
                position: fixed;
                top: 0%;
                left: 0%;
                width: 100%;
                height: 100%;
                display: none;
            }
            #question p {
                font-size: 50px;
                color: white;
                font-weight: bold;
                margin: 20%;
            }

            #question img {
                height: 100%;
                border: 0px 2px 0px 2px black solid;
            }

            #dailyDouble p {
                color: white;
                font-weight: bold;
                font-size: 100px;
                margin: 20%;
            }
            footer {
                position:fixed;
                bottom:5px;
                left: 50%;
                font-weight: bold;
            }

            a {
                color: yellow;
                text-decoration: none; 
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <h2>WHAT THE SHELF?</h2>
                <button id="c11" onclick="test('c11')">$100</button>
                <button id="c12" onclick="test('c12')">$200</button>
                <button id="c13" onclick="test('c13')">$300</button>
                <button id="c14" onclick="test('c14')">$400</button>
            </section>
            <section>
                <h2>DAY IN THE LIFE</h2>
                <button id="c21" onclick="test('c21')">$100</button>
                <button id="c22" onclick="test('c22')">$200</button>
                <button id="c23" onclick="test('c23')">$300</button>
                <button id="c24" onclick="test('c24')">$400</button>
            </section>
            <section>
                <h2>COLORS OF THE LIBRARY</h2>
                <button id="c31" onclick="test('c31')">$100</button>
                <button id="c32" onclick="test('c32')">$200</button>
                <button id="c33" onclick="test('c33')">$300</button>
                <button id="c34" onclick="test('c34')">$400</button>
            </section>
        </main>
        <div id="question" onclick="test2('question')">
        </div>
        <div id="dailyDouble" onclick="test2('dailyDouble')">
            <p>DAILY DOUBLE</p>
        </div>
        <footer><a href="./double.html">DOUBLE JEOPARDY</a></footer>
        <script>
            function test(id) {
                let btn = document.getElementById(id); // Uses the button id to select the button
                btn.disabled = true; // disables button so it can't be clicked again
                btn.style.color = "blue";

                if(obj[id][1] == null) {
                    document.getElementById("question").innerHTML = "<p>"+ obj[id][0] + "</p>";
                } else {
                    document.getElementById("question").innerHTML = "<img src= '"+ obj[id][1] + "'>"
                }

                if(id == "c34") {
                    document.getElementById("dailyDouble").style.display = "block";
                } else {
                    document.getElementById("question").style.display = "block";
                }
            }

            function test2(id) {
                console.log("close");
                let question = document.getElementById(id);
                question.style.display = "none";
                if(id != "question") {
                    document.getElementById("question").style.display = "block";
                }
            }

            const obj = {
                c11: ["THIS THREE-WORD NOTE INDICATES A SECTION IS TOO FULL TO SHELVE IN", null],
                c12: ["This tool-like term is shown here:", "/images/SAW.png"],
                c13: ["These shelves are full, but this is the real problem", "/images/5B.png"],
                c14: ["When choosing this book for display, it breaks this criteria", "/images/amish.png"],
                c21: ["WHEN THE MORNING SHIFT BEGINS, ONE PAGE CHECKS THE INDOOR BOOK DROP, WHILE THE OTHER PAGE DOES THIS", null],
                c22: ["WHEN DELIVERY ARRIVES, AFTER UNPACKING, THESE TYPES OF BOOKS ARE PAGE'S PRIORITY", null],
                c23: ["WHEN THE BELL DINGS A PAGE SHOULD HELP OUT AT THIS STATION, THOUGH SOMETIMES SMALL PATRONS JUMP THE GUN", null],
                c24: ["THIS PAGE TASK, DONE NIGHTLY, IS CRUCIAL FOR FIRE SAFETY", null],
                c31: ["THIS IS THE COLOR OF DOT ON THE SPINE OF A DVD THAT INDICATES IT IS TO BE SHELVED IN THE CHILDREN’S AREA", null],
                c32: ["IF YOU PUT A NEON PINK ROUTING FLAG IN AN ITEM, IT INDICATES IT WILL BE ROUTED TO THIS BRANCH", null],
                c33: ["FROM HARDEST TO EASIEST, THESE ARE THE COLORS OF THE BEGINNING READERS", null],
                c34: ["AFTER A LONG CLOSURE, PATRONS MIGHT QUESTION WHY THEIR ITEM WAS NOT CHECKED IN ON TIME IF WE DON'T REMEMBER THIS PROCESS. YOU WOULD USE THIS GRAPEY FLAG TO MARK YOUR BIN.", null]

            }
        </script>
    </body>
</html>
