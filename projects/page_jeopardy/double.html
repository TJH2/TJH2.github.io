<!DOCTYPE html>
<html>
    <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kreon:wght@300..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
        <style>
            * {
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }
            body {
                font-family: "kreon";
                text-align: center;
                background-color: blue;
            }
            main {
                display: grid;
                 grid-template-columns: 33.33% 33.33% 33.33%;
                 grid-auto-rows: 1fr;
            }
            section {
                display: grid;
                grid-auto-rows: 1fr;
                border-bottom: 2px black solid;
            }
            h2 {
                color: white;
                font-weight: bolder;
                font-size: 4vw;
                border: 2px black solid;
                padding: 1vw;
            }
            button {
            font-weight: bold;
            border: 2px black solid;
            font-size: 3vw;
            display: block;
            margin: auto;
            background-color: blue;
            color: yellow;
            width: 100%;
            height: 100%;
            }
            #question, #dailyDouble {
                background-color: blue;
                border: black solid 2px;
                position: fixed;
                top: 0%;
                left: 0%;
                width: 100%;
                height: 100%;
                display: none;
            }
            #question p {
                font-size: 50px;
                color: white;
                font-weight: bold;
                margin: 20%;
            }

            #question img {
                height: 100%;
                width: 100%;
            }

            #dailyDouble p {
                color: white;
                font-weight: bold;
                font-size: 100px;
                margin: 20%;
            }
            footer {
                position: fixed;
                bottom: 1vw;
                left: 50%;
                font-weight: bold;
            }

            a {
                color: yellow;
                font-size: 2vw;
                text-decoration: none; 
            }
        </style>
    </head>
    <body>
        <main>
            <section>
                <h2>FLAG! YOU'RE IT!</h2>
                <button id="c11" onclick="test('c11')">$200</button>
                <button id="c12" onclick="test('c12')">$400</button>
                <button id="c13" onclick="test('c13')">$600</button>
                <button id="c14" onclick="test('c14')">$800</button>
            </section>
            <section>
                <h2>DECODING DEWEY</h2>
                <button id="c21" onclick="test('c21')">$200</button>
                <button id="c22" onclick="test('c22')">$400</button>
                <button id="c23" onclick="test('c23')">$600</button>
                <button id="c24" onclick="test('c24')">$800</button>
            </section>
            <section>
                <h2>HOW MANY OF... WHAT?</h2>
                <button id="c31" onclick="test('c31')">$200</button>
                <button id="c32" onclick="test('c32')">$400</button>
                <button id="c33" onclick="test('c33')">$600</button>
                <button id="c34" onclick="test('c34')">$800</button>
            </section>
        </main>
        <div id="question" onclick="test2('question')">
        </div>
        <div id="dailyDouble" onclick="test2('dailyDouble')">
            <p>DAILY DOUBLE</p>
        </div>
        <footer><a href="./final.html">FINAL JEOPARDY</a></footer>
        <script>
            function test(id) {
                let btn = document.getElementById(id); // Uses the button id to select the button
                btn.disabled = true; // disables button so it can't be clicked again
                btn.style.color = "blue";

                if(obj[id][1] == null) {
                    document.getElementById("question").innerHTML = "<p>"+ obj[id][0] + "</p>";
                } else {
                    document.getElementById("question").innerHTML = "<img src= '"+ obj[id][1] + "'>"
                }

                if(id == "c34") {
                    document.getElementById("dailyDouble").style.display = "block";
                } else {
                    document.getElementById("question").style.display = "block";
                }
            }

            function test2(id) {
                console.log("close");
                let question = document.getElementById(id);
                question.style.display = "none";
                if(id != "question") {
                    document.getElementById("question").style.display = "block";
                }
            }

            const obj = {
                c11: ['THIS COLOR FLAG SHOULD BE FILLED OUT IF AN ITEM SCANS AS "WITHDRAWN" OR "DELETED"', null],
                c12: ["WHEN DETERMINING WHETHER TO SHELF PULL A BOOK, TWO OF THESE FOUR FACTORS MAY SEND IT TO THE MENDERY", null],
                c13: ["NOT TO BE CONFUSED WITH THE SNAG FLAG, THIS RED FLAG IS USED FOR WHICH TYPE OF ITEMS?", null],
                c14: ["IT'S MOT DAMAGED AND IT ISN'T WITHDRAWN... THIS ISSUE CALLS FOR THE USE OF A PURPLE CATALOGING FLAG", null],
                c21: ["THIS DEWEY CLASS RANGE CONTAINS TITLES ON ALIEN ENCOUNTERS, COMPUTER PROGRAMMING, AND BOOKS TO READ BEFORE YOU DIE ", null],
                c22: ["THE DEWEY DECIMAL NUMBER 398.2 CONTAINS BOOKS ON THIS SUBJECT", null],
                c23: ["THIS IS WHERE YOU WOULD LOOK TO FIND A BOOK TO DECODE YOUR DREAMS", null],
                c24: ["BAKING A CAKE? HEAD TO THIS DEWEY DECIMAL TO GET DIRECTIONS", null],
                c31: ["THIS IS THE NUMBER OF TOTES ON BOTH BAKER'S RACKS", null],
                c32: ["THIS IS THE NUMBER OF COLORED SHELVING CARTS THE PAGES USE", null],
                c33: ["THIS IS HOW MANY SPACES WE HAVE FOR OUTGOING TOTES", null],
                c34: ["THIS IS HOW MANY HOLD CARTS THE PAGES USE TO SHELVE HOLDS", null]

            }
        </script>
    </body>
</html>
